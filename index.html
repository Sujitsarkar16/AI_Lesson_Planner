<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Lesson Planner</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries,typography"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reactflow@11.11.4/dist/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <!-- Highlight.js CSS for code syntax highlighting in Markdown -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <style>
      body {
        font-family: 'Lexend', sans-serif;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Space Grotesk', sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .material-symbols-outlined.fill {
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#7c3aed", /* Violet 600 */
              "primary-dark": "#6d28d9", /* Violet 700 */
              "background-light": "#f8fafc", /* Slate 50 */
              "background-dark": "#0f172a", /* Slate 900 */
              "brand-yellow": "#fcd34d", /* Amber 300 */
              "brand-pink": "#f472b6", /* Pink 400 */
              "brand-blue": "#38bdf8", /* Sky 400 */
              "brand-green": "#4ade80", /* Green 400 */
              "brand-orange": "#fb923c", /* Orange 400 */
              "brand-black": "#1e293b", /* Slate 800 */
            },
            fontFamily: {
              "display": ["Space Grotesk", "sans-serif"],
              "body": ["Lexend", "sans-serif"]
            },
            boxShadow: {
              'neo': '4px 4px 0px 0px rgba(30, 41, 59, 1)',
              'neo-sm': '2px 2px 0px 0px rgba(30, 41, 59, 1)',
              'neo-lg': '6px 6px 0px 0px rgba(30, 41, 59, 1)',
            },
            borderWidth: {
              '3': '3px',
            }
          },
        },
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/jsx-runtime": "https://aistudiocdn.com/react@^19.2.0/jsx-runtime",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0",
    "react-dom/client": "https://aistudiocdn.com/react-dom@^19.2.0/client",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react-markdown": "https://esm.sh/react-markdown@9?bundle",
    "remark-gfm": "https://esm.sh/remark-gfm@4?bundle",
    "rehype-highlight": "https://esm.sh/rehype-highlight@7?bundle",
    "rehype-raw": "https://esm.sh/rehype-raw@7?bundle",
    "recharts": "https://esm.sh/recharts@2.12.0?bundle",
    "mermaid": "https://esm.sh/mermaid@10?bundle",
    "reactflow": "https://esm.sh/reactflow@11.11.4?bundle",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-background-light dark:bg-background-dark text-brand-black dark:text-white antialiased selection:bg-primary selection:text-white">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
